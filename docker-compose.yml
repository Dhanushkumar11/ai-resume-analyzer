services:
  backend:
    build: .
    container_name: resume-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: resume-frontend

    ports:
      - "80:80"

    depends_on:
      - backend    

  postgres:
    image: postgres:17
    container_name: resume-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - db_storage:/var/lib/postgresql/data

volumes:
  db_storage: